<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1> My Library </h1>
    <button class="new-btn" id="new-btn">New Book</button>
  </header>

  <main id="main">
  </main>

  <dialog id="my-dialog">
    <form id="form">
		  <fieldset> Add a book </fieldset>

		  <div class="input-group">
			  <label for="title"> Title </label>
			  <input type="text" name="title" id="title" required>
		  </div>

		  <div class="input-group">
			  <label for="author"> Author </label>
			  <input type="text" name="author" id="author" required>
		  </div>

		  <div class="input-group">
			  <label for="pages"> Pages </label>
			  <input type="number" name="pages" id="pages" required>
		  </div>

		  <div class="input-group">
			  <label for="pages"> Read 
			  <input type="checkbox" name="read" id="read"> </label>
		  </div>

		  <div class="btn-group">
        <button formmethod="dialog" type="button" class="cancel-btn" id="cancel-btn">Cancel</button>
			  <button type="submit" class="add-btn" id="add-btn">Add book</button>
		  </div>

	  </form>
  </dialog>

</body>
</html>
